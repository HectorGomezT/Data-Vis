[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f7f4ec"
secondaryBackgroundColor = "#ece7da"
textColor = "#1a1a19"
font = "sans serif"

[server]
headless = true
maxUploadSize = 10  # MB, igual que el límite de entregas

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
